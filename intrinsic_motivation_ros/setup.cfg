# Without this, setuptools puts the console_scripts in <prefix>/bin, and
# ros2 run / launch_ros look for them in <prefix>/lib/<package>. The launch
# then dies with "libexec directory ... does not exist" and nothing about
# the message points here. Every ament_python package needs this file.
[develop]
script_dir=$base/lib/intrinsic_motivation_ros

[install]
install_scripts=$base/lib/intrinsic_motivation_ros
